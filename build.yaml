include:
  # MDBT50Q-1MV2 USB/BLE dongle: split central with no local keys.
  - board: mdbt50q_rx
    shield: apex_predetor_dongle
    snippet: studio-rpc-usb-uart
    artifact-name: apex_predetor_dongle-mdbt50q
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # Left FDK HY0020 (nRF52832), direct SWD image without USB or bootloader.
  - board: hy0020/nrf52832
    shield: apex_predetor_left
    artifact-name: apex_predetor_left-hy0020
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  # Right FDK HY0020 (nRF52832).
  - board: hy0020/nrf52832
    shield: apex_predetor_right
    artifact-name: apex_predetor_right-hy0020
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: hy0020/nrf52832
    shield: settings_reset
    artifact-name: settings_reset-hy0020_nrf52832
  - board: mdbt50q_rx
    shield: settings_reset
    artifact-name: settings_reset-mdbt50q
